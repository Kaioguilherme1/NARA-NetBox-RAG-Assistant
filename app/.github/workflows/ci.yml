name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar linter
        run: pip install ruff
      - name: Compilar (checagem de sintaxe)
        run: |
          python -m py_compile agent_core.py
          python -m py_compile app.py
          python -m py_compile server.py
      - name: Lint
        run: ruff check . || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t agente-viagem:ci .
