# Front-end assistant-ui (Next.js), aponta para o agent-api.
# A imagem vem do projeto criado com 'npx assistant-ui@latest create' (veja
# frontend/README.md), com o route.ts apontando para o backend. Troque OWNER/REPO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agente-viagem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/agente-viagem-ui:latest
          env:
            - name: AGENT_API_URL
              value: "http://agent-api:8000/v1"
            - name: AGENT_API_KEY
              value: "sk-local-nao-usado"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agente-viagem
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
