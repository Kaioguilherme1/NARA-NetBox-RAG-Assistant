apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agente-viagem
  namespace: agente-viagem
  annotations:
    # streaming usa conexao longa: aumente os timeouts do proxy
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: viagem.SEU-DOMINIO.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
