# Backend: o agente exposto como API compativel com OpenAI (server.py)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: agente-viagem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      containers:
        - name: app
          # a imagem e atualizada pelo workflow de deploy (kubectl set image)
          image: ghcr.io/OWNER/REPO/agente-viagem:latest
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api
  namespace: agente-viagem
spec:
  selector:
    app: agent-api
  ports:
    - port: 8000
      targetPort: 8000
